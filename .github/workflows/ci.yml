name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core-msrv:
    name: Core MSRV / Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test mdstream all features
        run: cargo test -p mdstream --tests --all-features

      - name: Check mdstream examples
        run: cargo check -p mdstream --examples

      - name: Check mdstream pulldown examples
        run: cargo check -p mdstream --features pulldown --examples

  workspace-msrv:
    name: Workspace MSRV / Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test workspace all features
        run: cargo nextest run --workspace --all-features

      - name: Doc tests
        run: cargo test --workspace --all-features --doc

      - name: Check Tokio examples
        run: cargo check -p mdstream-tokio --examples

  quality:
    name: Stable quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace all features
        run: cargo nextest run --workspace --all-features

      - name: Doc tests
        run: cargo test --workspace --all-features --doc

      - name: Check mdstream examples
        run: cargo check -p mdstream --examples

      - name: Check mdstream pulldown examples
        run: cargo check -p mdstream --features pulldown --examples

      - name: Check Tokio examples
        run: cargo check -p mdstream-tokio --examples

      - name: Check benchmarks
        run: cargo check -p mdstream --benches

      - name: Package mdstream
        run: cargo package -p mdstream
