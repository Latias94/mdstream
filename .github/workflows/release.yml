name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate tag/version/changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure crate versions match tag
        run: |
          python3 - <<'PY'
          import os, re, tomllib

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Invalid tag version: {version}")

          crates = [
              ("mdstream", "mdstream/Cargo.toml"),
              ("mdstream-tokio", "mdstream-tokio/Cargo.toml"),
          ]

          for name, path in crates:
              with open(path, "rb") as f:
                  crate_version = tomllib.load(f)["package"]["version"]
              if crate_version != version:
                  raise SystemExit(
                      f"Tag v{version} does not match {name} version: {crate_version}"
                  )

          print(f"OK: v{version} matches all crate versions")
          PY

      - name: Ensure CHANGELOG.md contains version section
        run: |
          python3 - <<'PY'
          import os, re

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              text = f.read()

          patterns = [
              rf"^##\s+{re.escape(version)}(?:\s+-\s+\d{{4}}-\d{{2}}-\d{{2}})?\s*$",
              rf"^##\s+\[{re.escape(version)}\](?:\s+-\s+\d{{4}}-\d{{2}}-\d{{2}})?\s*$",
          ]
          if not any(re.search(p, text, flags=re.MULTILINE) for p in patterns):
              raise SystemExit(f"CHANGELOG.md is missing a '## {version}' section")
          print(f"OK: CHANGELOG.md contains section for {version}")
          PY

  core-msrv:
    name: Core MSRV / Rust 1.85
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test mdstream all features
        run: cargo test -p mdstream --tests --all-features

      - name: Check mdstream examples
        run: cargo check -p mdstream --examples

      - name: Check mdstream pulldown examples
        run: cargo check -p mdstream --features pulldown --examples

  workspace-msrv:
    name: Workspace MSRV / Rust 1.88
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test workspace all features
        run: cargo nextest run --workspace --all-features

      - name: Doc tests
        run: cargo test --workspace --all-features --doc

      - name: Check Tokio examples
        run: cargo check -p mdstream-tokio --examples

  test:
    name: Stable quality gate before publish
    runs-on: ubuntu-latest
    needs: [core-msrv, workspace-msrv]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace all features
        run: cargo nextest run --workspace --all-features

      - name: Doc tests
        run: cargo test --workspace --all-features --doc

      - name: Check mdstream examples
        run: cargo check -p mdstream --examples

      - name: Check mdstream pulldown examples
        run: cargo check -p mdstream --features pulldown --examples

      - name: Check Tokio examples
        run: cargo check -p mdstream-tokio --examples

      - name: Check benchmarks
        run: cargo check -p mdstream --benches

      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

      - name: Cargo package
        run: |
          # `mdstream-tokio` depends on `mdstream = ^X.Y.Z`. During `cargo package`, Cargo resolves
          # deps as if publishing (path overrides are removed), so packaging `mdstream-tokio` would
          # fail until `mdstream` is already available on crates.io.
          #
          # `cargo publish -p mdstream-tokio` later will run packaging again after we publish
          # `mdstream` and wait for it to appear on crates.io.
          cargo package -p mdstream

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Publish
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          crate_version_exists() {
            python3 - "$1" "$2" <<'PY'
          import sys
          import urllib.error
          import urllib.request

          crate, version = sys.argv[1], sys.argv[2]
          url = f"https://crates.io/api/v1/crates/{crate}/{version}"

          try:
              with urllib.request.urlopen(url) as resp:
                  resp.read()
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  raise SystemExit(1)
              raise

          raise SystemExit(0)
          PY
          }

          wait_for_crate_version() {
            python3 - "$1" "$2" <<'PY'
          import json
          import sys
          import time
          import urllib.request

          crate, version = sys.argv[1], sys.argv[2]
          url = f"https://crates.io/api/v1/crates/{crate}"

          for i in range(30):
              with urllib.request.urlopen(url) as resp:
                  data = json.load(resp)
              newest = data["crate"]["newest_version"]
              if newest == version:
                  print(f"OK: {crate} {version} is visible on crates.io")
                  break
              time.sleep(5)
          else:
              raise SystemExit(f"Timed out waiting for {crate} {version} to appear on crates.io")
          PY
          }

          publish_if_missing() {
            crate="$1"
            if crate_version_exists "$crate" "$version"; then
              echo "OK: $crate $version is already visible on crates.io; skipping publish"
            else
              cargo publish -p "$crate" --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
            fi
            wait_for_crate_version "$crate" "$version"
          }

          publish_if_missing mdstream
          publish_if_missing mdstream-tokio

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract release notes
        id: notes
        run: |
          python3 - <<'PY'
          import os
          import re

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              text = f.read()

          heading = re.compile(
              rf"^##\s+(?:{re.escape(version)}|\[{re.escape(version)}\])"
              rf"(?:\s+-\s+\d{{4}}-\d{{2}}-\d{{2}})?\s*$",
              flags=re.MULTILINE,
          )
          match = heading.search(text)
          if not match:
              raise SystemExit(f"CHANGELOG.md is missing release notes for {version}")

          next_heading = re.search(r"^##\s+", text[match.end():], flags=re.MULTILINE)
          end = match.end() + next_heading.start() if next_heading else len(text)
          notes = text[match.end():end].strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md release notes for {version} are empty")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("release_notes<<RELEASE_NOTES\n")
              out.write(notes)
              out.write("\nRELEASE_NOTES\n")
          PY

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.release_notes }}
