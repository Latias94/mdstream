name: Flutter platforms

on:
  workflow_call:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: flutter-platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Flutter / Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Golden fixture synchronization
        run: python3 scripts/sync-example-fixtures.py --check

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake libgtk-3-dev ninja-build xvfb

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild 0.23.0
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Install Flutter 3.32.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.1
          cache: true

      - name: Resolve Pub workspace
        working-directory: bindings
        run: flutter pub get

      - name: Resolve Golden stream example
        working-directory: bindings/flutter/example
        run: flutter pub get

      - name: Prove packaging validators
        run: python3 -m unittest bindings/flutter/tool/test_packaging.py

      - name: Build staged Linux library
        run: python3 bindings/flutter/tool/build_native.py linux

      - name: Build host library for controller tests
        working-directory: bindings/dart
        run: dart run tool/build_native.dart

      - name: Analyze Flutter package
        working-directory: bindings/flutter
        run: flutter analyze

      - name: Test Flutter controller against native runtime
        working-directory: bindings/flutter
        run: flutter test

      - name: Analyze Golden stream example
        working-directory: bindings/flutter/example
        run: flutter analyze

      - name: Test Golden stream widgets
        working-directory: bindings/flutter/example
        run: flutter test test/golden_stream_test.dart

      - name: Generate Linux Golden stream host
        working-directory: bindings/flutter/example
        run: flutter create --empty --platforms linux --project-name mdstream_flutter_example --org io.mdstream.example --no-pub .

      - name: Test bundled Golden stream bootstrap
        working-directory: bindings/flutter/example
        run: xvfb-run -a flutter test integration_test/golden_stream_smoke_test.dart -d linux

      - name: Load bundled Linux library
        run: xvfb-run -a python3 bindings/flutter/tool/package_smoke.py --platform linux --device linux --skip-native-build --skip-archive

      - name: Upload Linux native artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdstream-flutter-linux
          path: bindings/flutter/linux/lib
          if-no-files-found: error

  android:
    name: Flutter / Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust 1.85 Android targets
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Flutter 3.32.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.1
          cache: true

      - name: Resolve Pub workspace
        working-directory: bindings
        run: flutter pub get

      - name: Install pinned Android NDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "build-tools;35.0.0"'

      - name: Build staged Android libraries
        run: python3 bindings/flutter/tool/build_native.py android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Load bundled Android library
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_2
          script: python3 bindings/flutter/tool/android_smoke.py --skip-native-build --device emulator-5554

      - name: Upload Android native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdstream-flutter-android
          path: bindings/flutter/android/src/main/jniLibs
          if-no-files-found: error

  apple:
    name: Flutter / ${{ matrix.platform }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            rust-targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          - platform: macos
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.85 Apple targets
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Flutter 3.32.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.1
          cache: true

      - name: Resolve Pub workspace
        working-directory: bindings
        run: flutter pub get

      - name: Build staged Apple library
        run: python3 bindings/flutter/tool/build_native.py ${{ matrix.platform }}

      - name: Load bundled macOS library
        if: matrix.platform == 'macos'
        run: python3 bindings/flutter/tool/package_smoke.py --platform macos --device macos --skip-native-build --skip-archive

      - name: Load bundled macOS library through SwiftPM
        if: matrix.platform == 'macos'
        run: python3 bindings/flutter/tool/package_smoke.py --swiftpm --platform macos --skip-native-build

      - name: Boot iOS simulator and load bundled library
        if: matrix.platform == 'ios'
        timeout-minutes: 30
        shell: bash
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if "iPhone" in device["name"]))')"
          xcrun simctl boot "$DEVICE_ID" || true
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          python3 bindings/flutter/tool/package_smoke.py --platform ios --device "$DEVICE_ID" --skip-native-build --skip-archive
          python3 bindings/flutter/tool/package_smoke.py --swiftpm --platform ios --device "$DEVICE_ID" --skip-native-build

      - name: Upload Apple native artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdstream-flutter-${{ matrix.platform }}
          path: bindings/flutter/${{ matrix.platform }}/MdstreamFFI.xcframework
          if-no-files-found: error

  windows:
    name: Flutter / Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Flutter 3.32.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.1
          cache: true

      - name: Resolve Pub workspace
        working-directory: bindings
        run: flutter pub get

      - name: Resolve Golden stream example
        working-directory: bindings/flutter/example
        run: flutter pub get

      - name: Build staged Windows library
        run: python bindings/flutter/tool/build_native.py windows

      - name: Build host library for controller tests
        working-directory: bindings/dart
        run: dart run tool/build_native.dart

      - name: Analyze Flutter package
        working-directory: bindings/flutter
        run: flutter analyze

      - name: Test Flutter controller against native runtime
        working-directory: bindings/flutter
        run: flutter test

      - name: Load bundled Windows library
        run: python bindings/flutter/tool/package_smoke.py --platform windows --device windows --skip-native-build --skip-archive

      - name: Upload Windows native artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdstream-flutter-windows
          path: bindings/flutter/windows/lib
          if-no-files-found: error

  package:
    name: Assemble Flutter release package
    needs: [linux, android, apple, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter 3.32.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.1
          cache: true

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: mdstream-flutter-android
          path: bindings/flutter/android/src/main/jniLibs

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: mdstream-flutter-ios
          path: bindings/flutter/ios/MdstreamFFI.xcframework

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: mdstream-flutter-macos
          path: bindings/flutter/macos/MdstreamFFI.xcframework

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: mdstream-flutter-linux
          path: bindings/flutter/linux/lib

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: mdstream-flutter-windows
          path: bindings/flutter/windows/lib

      - name: Resolve Pub workspace
        working-directory: bindings
        run: flutter pub get

      - name: Resolve Flutter archive path
        shell: bash
        run: echo "FLUTTER_ARCHIVE=$(python3 bindings/flutter/tool/package_smoke.py --print-archive-path)" >> "$GITHUB_ENV"

      - name: Validate complete publish archive and budgets
        run: python3 bindings/flutter/tool/package_smoke.py --release --skip-native-build --skip-runtime

      - name: Verify exact Flutter package archive
        run: python3 scripts/verify-packages.py --phase local --ecosystem flutter --archive "$FLUTTER_ARCHIVE"

      - name: Upload Flutter publish archive
        uses: actions/upload-artifact@v4
        with:
          name: mdstream-flutter-package
          path: ${{ env.FLUTTER_ARCHIVE }}
          if-no-files-found: error

  package-linux-smoke:
    name: Load exact Flutter archive / Linux x86_64
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake libgtk-3-dev ninja-build xvfb

      - name: Install Flutter 3.32.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.1
          cache: true

      - name: Download exact Flutter publish archive
        uses: actions/download-artifact@v4
        with:
          name: mdstream-flutter-package
          path: target/flutter-package

      - name: Resolve Flutter archive path
        shell: bash
        run: echo "FLUTTER_ARCHIVE=$(python3 bindings/flutter/tool/package_smoke.py --print-archive-path)" >> "$GITHUB_ENV"

      - name: Load Linux plugin from exact publish archive
        run: xvfb-run -a python3 bindings/flutter/tool/package_smoke.py --archive "$FLUTTER_ARCHIVE" --platform linux --device linux --skip-native-build

  package-linux-legacy-smoke:
    name: Load exact Flutter archive / glibc 2.28
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Download exact Flutter publish archive
        uses: actions/download-artifact@v4
        with:
          name: mdstream-flutter-package
          path: target/flutter-package

      - name: Resolve Flutter archive path
        shell: bash
        run: echo "FLUTTER_ARCHIVE=$(python3 bindings/flutter/tool/package_smoke.py --print-archive-path)" >> "$GITHUB_ENV"

      - name: Build legacy-runtime consumer from exact archive
        shell: bash
        run: |
          python3 scripts/verify-packages.py --extract-only \
            "$FLUTTER_ARCHIVE" target/flutter-extracted
          mkdir -p target/flutter-linux-legacy-smoke
          zig cc -target x86_64-linux-gnu.2.17 \
            -I mdstream-ffi/include \
            mdstream-ffi/tests/c_consumer_smoke.c \
            -L target/flutter-extracted/linux/lib/x86_64 \
            -lmdstream_ffi \
            -Wl,-rpath,/mdstream/lib \
            -o target/flutter-linux-legacy-smoke/c-consumer

      - name: Run exact native library on Debian 10
        run: |
          docker run --rm \
            -v "$PWD/target/flutter-extracted/linux/lib/x86_64:/mdstream/lib:ro" \
            -v "$PWD/target/flutter-linux-legacy-smoke/c-consumer:/mdstream/c-consumer:ro" \
            debian:10.13-slim /mdstream/c-consumer

  package-apple-swiftpm-smoke:
    name: Load exact Flutter archive / SwiftPM macOS
    needs: package
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact Flutter publish archive
        uses: actions/download-artifact@v4
        with:
          name: mdstream-flutter-package
          path: target/flutter-package

      - name: Resolve Flutter archive path
        shell: bash
        run: echo "FLUTTER_ARCHIVE=$(python3 bindings/flutter/tool/package_smoke.py --print-archive-path)" >> "$GITHUB_ENV"

      - name: Load SwiftPM package from exact publish archive
        run: python3 bindings/flutter/tool/package_smoke.py --swiftpm --archive "$FLUTTER_ARCHIVE" --platform macos --skip-native-build
