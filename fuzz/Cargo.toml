[package]
name = "mdstream-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4.13"
mdstream = { path = "../mdstream" }
mdstream-conformance = { path = "../mdstream-conformance" }
mdstream-protocol = { path = "../mdstream-protocol" }

[[bin]]
name = "stream_chunking"
path = "fuzz_targets/stream_chunking.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structured_pending"
path = "fuzz_targets/structured_pending.rs"
test = false
doc = false
bench = false

[[bin]]
name = "terminator"
path = "fuzz_targets/terminator.rs"
test = false
doc = false
bench = false

[workspace]
