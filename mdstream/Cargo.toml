[package]
name = "mdstream"
version = "0.4.0"
description = "Headless streaming content engine with stable identity and replayable Markdown state."
readme = "../README.md"
edition = "2024"
rust-version = "1.85"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latias94/mdstream"
homepage = "https://github.com/Latias94/mdstream"
documentation = "https://docs.rs/mdstream"
keywords = ["markdown", "streaming", "llm", "incremental", "parser"]
categories = ["text-processing", "parsing"]
exclude = ["repo-ref/**"]

[dependencies]
mdstream-protocol = { path = "../mdstream-protocol", version = "0.4.0" }
pulldown-cmark = "=0.13.4"
unicase = "=2.9.0"

[dev-dependencies]
criterion = "0.7.0"
mdstream-conformance = { path = "../mdstream-conformance" }
mdstream-processors = { path = "../mdstream-processors" }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde_json = "1.0.140"
trybuild = "1.0.116"

[features]
default = []

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "streaming"
harness = false
