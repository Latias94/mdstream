[package]
name = "mdstream-tokio"
version = "0.3.0"
description = "Tokio glue for mdstream (delta coalescing and optional actor helpers)."
readme = "../README.md"
edition = "2024"
rust-version = "1.88.0"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latias94/mdstream"
homepage = "https://github.com/Latias94/mdstream"

[dependencies]
mdstream = { version = "0.3.0", path = "../mdstream" }
tokio = { version = "1.52.3", features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
unicode-width = "0.2.2"
